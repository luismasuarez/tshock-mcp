name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      # Unit test projects live under tests/: the gateway (net8.0) and the bridge
      # plugin (net9.0). The guard keeps the step informative if they are moved.
      - name: Test
        run: |
          if [ -n "$(find tests -name '*.csproj' -print -quit 2>/dev/null)" ]; then
            dotnet test -c Release --no-build
          else
            echo "No test project found under tests/; skipping."
          fi

      # Covers the 18 REST tools of phase 0 and events_since of phase 1 by MCP stdio
      # against a fake TShock server and a fake bridge; see docs/testing.md.
      - name: End-to-end smoke test (REST tools and bridge events)
        run: python3 tests/e2e/mcp_stdio_smoke.py
